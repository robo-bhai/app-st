name: Run AppStore Test Servers & Cloudflare Tunnel

on:
  workflow_dispatch:

# When a new workflow is triggered, cancel any previously running instance safely
concurrency:
  group: appstore-server-group
  cancel-in-progress: true

jobs:
  run-appstore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ----------------------------------------------------
      # 1. INSTALL & SETUP RCLONE (Google Drive CLI)
      # ----------------------------------------------------
      - name: Install Rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          rclone version

      - name: Setup Rclone Config
        env:
          RCLONE_CONFIG_BODY: ${{ secrets.RCLONE_CONFIG_DATA }}
        run: |
          if [ -z "$RCLONE_CONFIG_BODY" ]; then
            echo "NOTICE: RCLONE_CONFIG_DATA secret is not provided."
            echo "Skipping Google Drive setup. Server will run with local database persistence."
            exit 0
          fi
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_BODY" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          echo "Rclone config installed successfully."
          
          # Test connection to Google Drive
          echo "=== Testing Google Drive Connection ==="
          rclone lsd gdrive: || {
            echo "WARNING: Could not list gdrive root. Checking AppStoreBackup folder directly..."
          }

      # ----------------------------------------------------
      # 2. RESTORE DB, MEDIA & APKS FROM GOOGLE DRIVE (BEFORE STARTUP)
      # ----------------------------------------------------
      - name: Restore DB, Media & APKs from Google Drive
        run: |
          mkdir -p media apks
          if [ ! -f ~/.config/rclone/rclone.conf ]; then
            echo "NOTICE: Rclone config missing. Skipping Google Drive download, using local assets."
            exit 0
          fi
          echo "=========================================================="
          echo "  RESTORE DATA: Downloading latest state from Google Drive"
          echo "=========================================================="

          # 1. Check if remote backup exists
          if rclone lsf gdrive:AppStoreBackup/db.sqlite3 > /dev/null 2>&1; then
            echo ">>> Remote db.sqlite3 found! Overwriting local with remote backup..."
            # Use copyto to ensure exact file replacement (NO --ignore-existing!)
            rclone copyto gdrive:AppStoreBackup/db.sqlite3 ./db.sqlite3 --verbose
            
            # Also restore any WAL/SHM file if uploaded
            rclone copy gdrive:AppStoreBackup/ ./ --include "db.sqlite3-*" --verbose || true
            
            echo "Database successfully restored from Google Drive."
            ls -lh db.sqlite3
          else
            echo ">>> No existing remote db.sqlite3 found on Drive. A fresh database will be initialized."
          fi

          # 2. Restore Media and APKs comprehensively (no missing icons or assets)
          echo ">>> Restoring media assets, icons, banners, and APK files..."
          mkdir -p media media/icons media/banners media/apks apks
          rclone copy gdrive:AppStoreBackup/media ./media/ --verbose || true
          rclone copy gdrive:AppStoreBackup/icons ./media/icons/ --verbose || true
          rclone copy gdrive:AppStoreBackup/banners ./media/banners/ --verbose || true
          rclone copy gdrive:AppStoreBackup/apks ./apks/ --verbose || true
          rclone copy gdrive:AppStoreBackup/apks ./media/apks/ --verbose || true
          
          # Sync between apks/ and media/apks/ so APKs are available regardless of path!
          cp -r apks/* media/apks/ 2>/dev/null || true
          cp -r media/apks/* apks/ 2>/dev/null || true
          
          echo "Restore step completed successfully. Restored media tree:"
          ls -R media/ || true

      # ----------------------------------------------------
      # 3. INSTALL CLOUDFLARED
      # ----------------------------------------------------
      - name: Install Cloudflared
        run: |
          echo "=== Installing Cloudflared ==="
          curl -sL --retry 3 --output /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb || sudo apt-get install -f -y
          cloudflared --version

      # ----------------------------------------------------
      # 4. INSTALL PYTHON DEPENDENCIES & PREPARE ASSETS
      # ----------------------------------------------------
      - name: Install Python Dependencies & Prepare Assets
        run: |
          echo "=== Installing Python dependencies ==="
          python -m pip install --upgrade pip setuptools wheel
          pip install gunicorn whitenoise
          if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
          fi

          echo "=== Preparing Asset & Media directories ==="
          mkdir -p public/images static/images static/css media/icons media/banners media/apks apks staticfiles
          if [ -d "src/assets/images" ]; then
            cp -r src/assets/images/* public/images/ 2>/dev/null || true
            cp -r src/assets/images/* static/images/ 2>/dev/null || true
          fi
          if [ -d "public/images" ]; then
            cp -r public/images/* static/images/ 2>/dev/null || true
          fi
          echo "Dependencies installed and asset directories prepared."

      # ----------------------------------------------------
      # 5. RUN DJANGO MIGRATIONS & COLLECT STATIC
      # ----------------------------------------------------
      - name: Run Django Migrations & Collect Static
        env:
          DJANGO_SETTINGS_MODULE: appstore_project.settings
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          echo "=== Running Django Migrations (Safe Mode & Schema Upgrades) ==="
          python manage.py makemigrations store || true
          python manage.py makemigrations || true
          python manage.py migrate --run-syncdb || python manage.py migrate --noinput

          # Auto-heal: Ensure all models including store_appreview exist in SQLite
          python - << 'EOF' || true
          import os, django
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'appstore_project.settings')
          django.setup()
          from django.db import connection
          with connection.cursor() as cursor:
              tables = connection.introspection.table_names()
              if 'store_app' in tables and 'store_appreview' not in tables:
                  cursor.execute("""
                      CREATE TABLE IF NOT EXISTS store_appreview (
                          id INTEGER PRIMARY KEY AUTOINCREMENT,
                          user_name VARCHAR(100) NOT NULL,
                          user_avatar VARCHAR(200) NOT NULL DEFAULT '',
                          rating SMALLINT UNSIGNED NOT NULL DEFAULT 5,
                          comment TEXT NOT NULL,
                          device_model VARCHAR(100) NOT NULL DEFAULT 'Android Device',
                          helpful_count INTEGER UNSIGNED NOT NULL DEFAULT 0,
                          created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
                          app_id BIGINT NOT NULL REFERENCES store_app (id) DEFERRABLE INITIALLY DEFERRED
                      );
                  """)
                  cursor.execute("CREATE INDEX IF NOT EXISTS store_appreview_app_id_idx ON store_appreview (app_id);")
                  print("[Workflow Auto-Heal] Successfully ensured store_appreview table exists.")
          EOF

          echo "=== Collecting Static Files & Syncing Django Admin Design ==="
          mkdir -p static staticfiles media static/images public/images media/banners media/icons static/css static/admin staticfiles/admin
          
          # Run collectstatic with finders without clearing custom pre-bundled assets
          python manage.py collectstatic --noinput || true

          # Direct sync of Django Admin package assets into static/admin and staticfiles/admin
          python - << 'EOF' || true
          import os, shutil, django
          from django.conf import settings
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'appstore_project.settings')
          django.setup()
          from django.contrib.staticfiles import finders

          # Ensure static/admin is fully populated in static and staticfiles
          dest_static = os.path.join(settings.BASE_DIR, 'static', 'admin')
          dest_staticfiles = os.path.join(settings.BASE_DIR, 'staticfiles', 'admin')
          os.makedirs(dest_static, exist_ok=True)
          os.makedirs(dest_staticfiles, exist_ok=True)

          admin_base_css = finders.find('admin/css/base.css')
          if admin_base_css and os.path.exists(admin_base_css):
              admin_pkg_dir = os.path.dirname(os.path.dirname(os.path.dirname(admin_base_css)))
              if os.path.exists(admin_pkg_dir):
                  shutil.copytree(admin_pkg_dir, dest_static, dirs_exist_ok=True)
                  shutil.copytree(admin_pkg_dir, dest_staticfiles, dirs_exist_ok=True)
          
          # Also guarantee mirror from static/admin to staticfiles/admin
          if os.path.exists(dest_static):
              shutil.copytree(dest_static, dest_staticfiles, dirs_exist_ok=True)
              print(f"[Workflow] Admin static assets confirmed in {dest_static} and {dest_staticfiles}.")
          EOF

          if [ -d "static/css" ]; then
            mkdir -p staticfiles/css
            cp -r static/css/* staticfiles/css/ 2>/dev/null || true
          fi

          # Verify database records
          python - << 'EOF' || true
          import os, django
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'appstore_project.settings')
          django.setup()
          from store.models import App, AppDemand
          print(f"[DB Status] Total Apps in DB: {App.objects.count()}")
          print(f"[DB Status] Total Demands in DB: {AppDemand.objects.count()}")
          EOF

      # ----------------------------------------------------
      # 6. CREATE OR REFRESH SUPERUSER (SAFE - NO DATA LOSS)
      # ----------------------------------------------------
      - name: Create or Refresh Superuser
        env:
          DJANGO_SUPERUSER_USERNAME: ${{ secrets.SUPERUSER_USERNAME }}
          DJANGO_SUPERUSER_EMAIL: ${{ secrets.SUPERUSER_EMAIL }}
          DJANGO_SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
        run: |
          python - << 'EOF'
          import os, django
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'appstore_project.settings')
          django.setup()
          from django.contrib.auth import get_user_model
          
          User = get_user_model()
          raw_username = os.getenv('DJANGO_SUPERUSER_USERNAME', '')
          custom_username = raw_username.strip() if raw_username and raw_username.strip() else 'admin'
          
          raw_email = os.getenv('DJANGO_SUPERUSER_EMAIL', '')
          custom_email = raw_email.strip() if raw_email and raw_email.strip() else 'admin@example.com'
          
          raw_password = os.getenv('DJANGO_SUPERUSER_PASSWORD', '')
          password = raw_password.strip() if raw_password and raw_password.strip() else 'admin1234'

          accounts_to_ensure = [
              (custom_username, custom_email, password),
              ('admin', 'admin@example.com', password),
              ('nomi', 'nomistorage3@gmail.com', password),
          ]

          for uname, uemail, upass in accounts_to_ensure:
              user = User.objects.filter(username=uname).first()
              if not user and uemail:
                  user = User.objects.filter(email=uemail).first()
              
              if not user:
                  user = User.objects.create_superuser(username=uname, email=uemail, password=upass)
              else:
                  user.set_password(upass)
                  user.email = uemail
              
              user.is_active = True
              user.is_staff = True
              user.is_superuser = True
              user.save()
              print(f"[Auth] Superuser '{uname}' (email: {uemail}) verified active with password: {upass[:2]}****")
          EOF

      # ----------------------------------------------------
      # 7. START GUNICORN BACKEND (PORT 8000)
      # ----------------------------------------------------
      - name: Start Gunicorn (Backend)
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          echo "=== Starting Gunicorn on 0.0.0.0:8000 ==="
          nohup gunicorn appstore_project.wsgi:application \
            --bind 0.0.0.0:8000 \
            --workers 3 \
            --timeout 120 \
            --access-logfile gunicorn_access.log \
            --error-logfile gunicorn.log > /dev/null 2>&1 &
          
          # Health check for port 8000
          for i in {1..20}; do
            if curl -s http://127.0.0.1:8000/ > /dev/null 2>&1; then
              echo "Gunicorn backend is up and running!"
              break
            fi
            sleep 1
          done

      # ----------------------------------------------------
      # 8. START CLOUDFLARE TUNNEL (DJANGO BACKEND PORT 8000)
      # ----------------------------------------------------
      - name: Start Cloudflare Tunnel (Django Backend & Admin)
        env:
          BACKEND_TOKEN: ${{ secrets.CLOUDFLARE_BACKEND_TOKEN || secrets.CLOUDFLARE_TUNNEL_TOKEN || secrets.CLOUDFLARE_TOKEN }}
        run: |
          if [ -n "$BACKEND_TOKEN" ]; then
            echo "=== Starting Cloudflare Tunnel with Custom Domain Token ==="
            nohup cloudflared tunnel --no-autoupdate run --token "$BACKEND_TOKEN" > backend_cf.log 2>&1 &
            sleep 5
            echo "Cloudflare tunnel launched with configured token."
            echo "Connecting to your configured domain (e.g., https://api.uqn88.store or https://uqn88.store)."
          else
            echo "=== CLOUDFLARE_BACKEND_TOKEN secret not set ==="
            echo "=== Launching Free Instant TryCloudflare Tunnel (No Token Needed) ==="
            nohup cloudflared tunnel --url http://127.0.0.1:8000 --no-autoupdate > backend_cf.log 2>&1 &
            sleep 6
            TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' backend_cf.log | head -n 1 || true)
            echo "=========================================================="
            echo "  PUBLIC LIVE TUNNEL URL: $TUNNEL_URL"
            echo "  Storefront: ${TUNNEL_URL}/"
            echo "  Django Admin: ${TUNNEL_URL}/admin/"
            echo "  Custom Admin: ${TUNNEL_URL}/admin/manage/login/"
            echo "=========================================================="
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              echo "## 🚀 Hadi88 AppStore Server is LIVE!" >> $GITHUB_STEP_SUMMARY
              echo "- **Public Store:** [$TUNNEL_URL]($TUNNEL_URL)" >> $GITHUB_STEP_SUMMARY
              echo "- **Django Admin:** [$TUNNEL_URL/admin/]($TUNNEL_URL/admin/)" >> $GITHUB_STEP_SUMMARY
              echo "- **Custom Management:** [$TUNNEL_URL/admin/manage/]($TUNNEL_URL/admin/manage/)" >> $GITHUB_STEP_SUMMARY
              echo "- **Login Username:** \`admin\` or \`nomistorage3@gmail.com\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Login Password:** \`admin1234\` (or secret \`SUPERUSER_PASSWORD\`)" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      # ----------------------------------------------------
      # 9. MONITOR, AUTO-BACKUP DAEMON & KEEP ALIVE (Up to 6 Hours)
      # ----------------------------------------------------
      - name: Monitor, Keep Alive & Periodic Drive Sync (360 Minutes)
        timeout-minutes: 360
        run: |
          echo "=========================================================="
          echo "  Hadi88 Django Store & Admin Server LIVE!"
          echo "  - Backend (Django / Gunicorn): Port 8000"
          echo "  - Cloudflare Tunnel: Connected to 0.0.0.0:8000"
          echo "  - Periodic Google Drive auto-sync active every 5 minutes"
          echo "=========================================================="
          
          # Start background auto-backup daemon every 5 minutes
          # This protects against unexpected runner cancellation or crashes
          (
            while true; do
              sleep 45
              echo "[Auto-Backup Daemon] Running periodic sync to Google Drive..."
              if [ -f ~/.config/rclone/rclone.conf ]; then
                # Safe SQLite WAL checkpoint flush
                python - << 'EOF' || true
                import sqlite3, os
                if os.path.exists('db.sqlite3'):
                    try:
                        conn = sqlite3.connect('db.sqlite3')
                        conn.execute('PRAGMA wal_checkpoint(PASSIVE);')
                        conn.close()
                    except Exception:
                        pass
          EOF
                if [ -f "db.sqlite3" ]; then
                  rclone copyto db.sqlite3 gdrive:AppStoreBackup/db.sqlite3 --quiet || true
                fi
                if [ -d "media/apks" ]; then
                  mkdir -p apks
                  cp -r media/apks/* apks/ 2>/dev/null || true
                fi
                if [ -d "apks" ]; then
                  mkdir -p media/apks
                  cp -r apks/* media/apks/ 2>/dev/null || true
                fi
                if [ -d "media" ]; then
                  rclone copy media gdrive:AppStoreBackup/media/ --update --quiet || true
                fi
                if [ -d "media/icons" ]; then
                  rclone copy media/icons gdrive:AppStoreBackup/icons/ --update --quiet || true
                fi
                if [ -d "media/banners" ]; then
                  rclone copy media/banners gdrive:AppStoreBackup/banners/ --update --quiet || true
                fi
                if [ -d "apks" ]; then
                  rclone copy apks gdrive:AppStoreBackup/apks/ --update --quiet || true
                fi
                echo "[Auto-Backup Daemon] Periodic sync completed."
              fi
            done
          ) &
          AUTOSYNC_PID=$!
          echo "Auto-backup background daemon started (PID: $AUTOSYNC_PID)."

          # Monitor loops
          for i in {1..360}; do
            sleep 60
            
            # Check Cloudflared process
            if ! pgrep -f "cloudflared" > /dev/null; then
              echo "CRITICAL: Cloudflared process stopped!"
              tail -n 30 backend_cf.log || true
              kill $AUTOSYNC_PID 2>/dev/null || true
              exit 1
            fi
            
            # Check Gunicorn process
            if ! pgrep -f "gunicorn" > /dev/null; then
              echo "CRITICAL: Gunicorn backend stopped!"
              tail -n 30 gunicorn.log || true
              kill $AUTOSYNC_PID 2>/dev/null || true
              exit 1
            fi
            
            # Heartbeat log every 15 minutes
            if (( i % 15 == 0 )); then
              echo "[Heartbeat] Server live for $i minutes..."
            fi
          done

          kill $AUTOSYNC_PID 2>/dev/null || true

      # ----------------------------------------------------
      # 10. SAFE PUSH DATA TO GOOGLE DRIVE ON CLOSE (always())
      # ----------------------------------------------------
      - name: Safe Push Data to Google Drive on Close
        if: always()
        run: |
          echo "=========================================================="
          echo "  WORKFLOW CLOSING: Syncing ALL Data to Google Drive"
          echo "=========================================================="

          # 1. Gracefully stop Gunicorn & Cloudflared so all database writes are committed
          echo ">>> Stopping background processes cleanly..."
          pkill -f "gunicorn" 2>/dev/null || true
          pkill -f "cloudflared" 2>/dev/null || true
          sleep 2

          # 2. SQLite WAL Checkpoint (TRUNCATE) & VACUUM to ensure 100% written into db.sqlite3
          echo ">>> Flushing SQLite WAL log into main database file..."
          python - << 'EOF' || true
          import os, sqlite3
          if os.path.exists('db.sqlite3'):
              try:
                  conn = sqlite3.connect('db.sqlite3')
                  conn.execute('PRAGMA wal_checkpoint(TRUNCATE);')
                  conn.commit()
                  conn.close()
                  print("SQLite WAL TRUNCATE checkpoint finished successfully.")
              except Exception as e:
                  print(f"WAL Checkpoint warning: {e}")
          EOF

          # 3. Upload DB, Media & APKs back to Google Drive
          if [ -f ~/.config/rclone/rclone.conf ]; then
            TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
            
            if [ -f "db.sqlite3" ]; then
              echo ">>> Backing up primary db.sqlite3..."
              rclone copyto db.sqlite3 gdrive:AppStoreBackup/db.sqlite3 --verbose
              
              echo ">>> Creating timestamped snapshot backup (db_${TIMESTAMP}.sqlite3)..."
              rclone copyto db.sqlite3 gdrive:AppStoreBackup/snapshots/db_${TIMESTAMP}.sqlite3 --verbose || true
            else
              echo "WARNING: db.sqlite3 not found locally!"
            fi
            
            # Sync between media/apks and apks before push to Drive
            if [ -d "media/apks" ]; then
              mkdir -p apks
              cp -r media/apks/* apks/ 2>/dev/null || true
            fi
            if [ -d "apks" ]; then
              mkdir -p media/apks
              cp -r apks/* media/apks/ 2>/dev/null || true
            fi

            if [ -d "media" ]; then
              echo ">>> Syncing media files (uploaded icons, banners, APKs)..."
              rclone copy media gdrive:AppStoreBackup/media/ --verbose
            fi

            if [ -d "media/icons" ]; then
              echo ">>> Syncing icons directly..."
              rclone copy media/icons gdrive:AppStoreBackup/icons/ --verbose || true
            fi

            if [ -d "media/banners" ]; then
              echo ">>> Syncing banners directly..."
              rclone copy media/banners gdrive:AppStoreBackup/banners/ --verbose || true
            fi

            if [ -d "apks" ]; then
              echo ">>> Syncing apks directory..."
              rclone copy apks gdrive:AppStoreBackup/apks/ --verbose
            fi

            echo "=== Verification of Google Drive Remote Backup ==="
            rclone lsf gdrive:AppStoreBackup/ || true

            echo "=========================================================="
            echo "  DATA SUCCESSFULLY BACKED UP TO GOOGLE DRIVE!"
            echo "=========================================================="
          else
            echo "ERROR: Rclone config missing on shutdown. Backup could not be pushed."
          fi
